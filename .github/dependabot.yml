version: 2
updates:
  # Maintain Python (pip) dependencies
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    # ── Packages with no upstream security patch yet ───────────────────────
    # CVE-2025-69872 (diskcache – pickle deserialization): no fix in ≤5.6.3
    # CVE-2026-6587  (ragas – SSRF in multi_modal_faithfulness): no fix in ≤0.4.3
    # Remove these ignore entries once the upstream packages release a patch.
    ignore:
      - dependency-name: "diskcache"
        update-types: ["version-update:semver-patch"]
      - dependency-name: "ragas"
        update-types: ["version-update:semver-patch"]
